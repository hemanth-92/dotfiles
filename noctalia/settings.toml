config_version = 14

[audio]
enable_overdrive = true

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = [ "spectrum" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.spectrum]
    box_height = 60.0
    box_width = 1000.0
    cx = 768.0
    cy = 70.0
    flip_y = true
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.spectrum.settings]
        background = false
        bands = 64
        centered = false
        color_1 = "primary"
        color_2 = "secondary"
        mirrored = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 805.0
    cy = 673.99993896484375
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.screenshot]
    directory = "/home/dusk/Pictures"

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.automation]
enabled = false

[wallpaper.default]
path = "/home/dusk/Pictures/walls-catppuccin-mocha/cabin-2.jpg"

[wallpaper.last]
path = "/home/dusk/Pictures/walls-catppuccin-mocha/cabin-2.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/dusk/Pictures/walls-catppuccin-mocha/cabin-2.jpg"